  <div class="form-row">

  <div class="form-row">

  <div class="form-row" style="position: relative; margin-bottom: 0px;">

  <div class="form-row">

      <input type="text" id="postgres-magic-prompt" placeholder="Describe what query you want..." style="flex: 1;">

    </div>
    <div id="postgres-magic-result" style="display: none; margin-top: 8px; padding: 8px; background: #f0f0f0; border-radius: 4px; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; max-height: 120px; overflow-y: auto;">
    </div>
    <div id="postgres-magic-actions" style="display: none; margin-top: 4px; gap: 4px;">
      <button id="postgres-magic-insert" class="red-ui-button red-ui-button-small">
        <i class="fa fa-check"></i> Insert
      </button>
      <button id="postgres-magic-retry" class="red-ui-button red-ui-button-small">
        <i class="fa fa-refresh"></i> Retry
      </button>
      <button id="postgres-magic-cancel" class="red-ui-button red-ui-button-small">
        <i class="fa fa-times"></i> Cancel

    </div>
    <div id="postgres-magic-error" style="display: none; margin-top: 4px; color: #c00; font-size: 0.85em;"></div>

</script>
<script type="text/javascript">
  RED.nodes.registerType("PostgresNode", {
    category: "storage",
    color: 'rgb(5, 93, 193)',
    defaults: {
      name: {
        value: ""
      },
      query: {
        value: "SELECT * FROM ;"
      },
      PostgresDBNode: {
        type: "PostgresDBNode",
        required: true
      },
      outputs: {
        value: 1
      },
      throwErrors: {
        value: false,
      },
      useNamedParams: {
        value: false,
      },
      queryTimeout: {
        value: 0,
      },
      queryTimeoutFieldType: {
        value: "num",
      },
      mapNumeric: {
        value: false,
      },
      mapTimestamptz: {
        value: false,
      },
      parseJsonb: {
        value: true,
      },
      transactionMode: {
        value: false,
      },
      cursorMode: {
        value: false,
      },
      copyMode: {
        value: false,
      },
      cursorBatchSize: {
        value: 100,
      },
      cursorBatchSizeFieldType: {
        value: "num",
      },
      retryEnabled: {
        value: false,
      },
      maxRetries: {
        value: 3,
      },
      maxRetriesFieldType: {
        value: "num",
      },
      retryBaseDelay: {
        value: 100,
      },
      retryBaseDelayFieldType: {
        value: "num",
      }
    },
    inputs: 1,
    icon: "sql.png",
    iconStyle: "red-node-icon sql",
    align: "left",
    label: function () {
      return this.name || "query";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      $("#node-input-throwErrors").prop("checked", this.throwErrors);
      $("#node-input-useNamedParams").prop("checked", this.useNamedParams);

      this.editor = RED.editor.createEditor({
        id: 'node-input-editor',
        mode: 'ace/mode/sql',
        value: $("#node-input-query").val(),
        options: {
          showLineNumbers: true,
          wrap: true,
          useWorker: false,
          maxLines: Infinity,
          fontSize: 14,
          enableBasicAutocompletion: true,
          enableLiveAutocompletion: true,
          // Monaco-native options (Node-RED 5.x uses Monaco, not ACE)
          quickSuggestions: true,
          suggestOnTriggerCharacters: true,
          wordBasedSuggestions: 'currentDocument',
        }
      });
      this.editor.focus();

      // Force-enable Monaco completions if disabled
      var rawM = this.editor.editor || this.editor;
      if (rawM && rawM.updateOptions && typeof rawM.updateOptions === 'function') {
        rawM.updateOptions({
          quickSuggestions: true,
          suggestOnTriggerCharacters: true,
          wordBasedSuggestions: 'currentDocument',
        });
        console.log("[postgres-autocomplete] Monaco quickSuggestions enabled via updateOptions");
      }

      // Schema-aware autocomplete using Monaco editor API
      if (typeof monaco !== 'undefined') {
        var mEditor = this.editor.editor || this.editor;
        var model = mEditor && mEditor.getModel ? mEditor.getModel() : null;
        var langId = model ? model.getLanguageId() : null;
        console.log("[postgres-autocomplete] Monaco editor language:", langId);

        if (!langId) {
          console.log("[postgres-autocomplete] No language ID found — aborting");
        } else {
          monaco.languages.registerCompletionItemProvider(langId, {
            provideCompletionItems: function(model, position) {
              console.log("[postgres-autocomplete] provideCompletionItems called, schemaLoaded:", !!self._schemaCache);
              if (!self._schemaCache) return { suggestions: [] };
              var tables = self._schemaCache.tables || {};

              var textToCursor = model.getValueInRange({
                startLineNumber: 1, startColumn: 1,
                endLineNumber: position.lineNumber, endColumn: position.column,
              });

              var suggestions = [];
              var fromMatch = textToCursor.match(/\bFROM\s+("?[\w.]*"?)$/i);
              var joinMatch = textToCursor.match(/\bJOIN\s+("?[\w.]*"?)$/i);
              if (fromMatch || joinMatch) {
                var partial = (fromMatch || joinMatch)[1].replace(/"/g, '').toLowerCase();
                for (var key in tables) {
                  if (tables.hasOwnProperty(key) && (!partial || key.toLowerCase().indexOf(partial) >= 0)) {
                    suggestions.push({
                      label: key, kind: monaco.languages.CompletionItemKind.Class,
                      insertText: key, detail: Object.keys(tables[key].columns || {}).length + ' cols',
                    });
                  }
                }
              } else {
                var dotMatch = textToCursor.match(/[\s,(](\w+)\.(\w*)$/);
                if (dotMatch) {
                  var alias = dotMatch[1];
                  var colPrefix = dotMatch[2].toLowerCase();
                  for (var key in tables) {
                    if (tables.hasOwnProperty(key)) {
                      var shortName = key.split('.').pop();
                      if (shortName === alias || key === alias) {
                        var cols = tables[key].columns || [];
                        var pk = tables[key].primaryKey || [];
                        for (var i = 0; i < cols.length; i++) {
                          if (!colPrefix || cols[i].name.toLowerCase().indexOf(colPrefix) === 0) {
                            var isPk = pk.indexOf(cols[i].name) >= 0;
                            suggestions.push({
                              label: cols[i].name, kind: monaco.languages.CompletionItemKind.Field,
                              insertText: cols[i].name,
                              detail: cols[i].type + (isPk ? ' PK' : '') + (cols[i].nullable ? '' : ' NOT NULL'),
                            });
                          }
                        }
                        break;
                      }
                    }
                  }
                }
              }
              console.log("[postgres-autocomplete] returning", suggestions.length, "suggestions");
              return { suggestions: suggestions };
            }
          });
          console.log("[postgres-autocomplete] Completer registered for language:", langId);
        }
      }

      // Initialize type mapping checkbox states from current config
      $("#node-input-mapNumeric").prop("checked", this.mapNumeric === true || this.mapNumeric === 'true');
      $("#node-input-mapTimestamptz").prop("checked", this.mapTimestamptz === true || this.mapTimestamptz === 'true');
      $("#node-input-parseJsonb").prop("checked", this.parseJsonb !== false && this.parseJsonb !== 'false');
      $("#node-input-transactionMode").prop("checked", this.transactionMode === true || this.transactionMode === 'true');

      // Initialize queryTimeout typedInput
      if (this.queryTimeoutFieldType === undefined || this.queryTimeoutFieldType === '') {
        this.queryTimeoutFieldType = 'num';
      }
      $("#node-input-queryTimeout").typedInput({
        type: this.queryTimeoutFieldType || 'num',
        types: ['num', 'flow', 'global'],
        typeField: "#node-input-queryTimeoutFieldType"
      });

      $("#node-input-cursorMode").prop("checked", this.cursorMode === true || this.cursorMode === 'true');
      $("#node-input-copyMode").prop("checked", this.copyMode === true || this.copyMode === 'true');
      $("#node-input-retryEnabled").prop("checked", this.retryEnabled === true || this.retryEnabled === 'true');

      $("#node-input-cursorBatchSize").typedInput({
        type: this.cursorBatchSizeFieldType || 'num',
        types: ['num', 'flow', 'global'],
        typeField: "#node-input-cursorBatchSizeFieldType"
      });
      $("#node-input-maxRetries").typedInput({
        type: this.maxRetriesFieldType || 'num',
        types: ['num', 'flow', 'global'],
        typeField: "#node-input-maxRetriesFieldType"
      });
      $("#node-input-retryBaseDelay").typedInput({
        type: this.retryBaseDelayFieldType || 'num',
        types: ['num', 'flow', 'global'],
        typeField: "#node-input-retryBaseDelayFieldType"
      });

      // --- Magic Wand + Query Generator + Type Hints ---
      var self = this;
      var magicPrompt = $("#postgres-magic-prompt");
      var magicResult = $("#postgres-magic-result");
      var magicActions = $("#postgres-magic-actions");
      var magicError = $("#postgres-magic-error");
      var magicGenerate = $("#postgres-magic-generate");
      var genQueryBtn = $("#postgres-gen-query-btn");
      var typeHints = $("#postgres-type-hints");

      function updateTypeHints() {
        if (!self._schemaCache) { typeHints.text(""); return; }
        var query = self.editor ? self.editor.getValue() : "";
        var tables = self._schemaCache.tables || {};
        var fromMatch = query.match(/FROM\s+"?(\w+\.?\w*)"?/i);
        if (fromMatch && fromMatch[1]) {
          var tableKey = fromMatch[1];
          var table = tables[tableKey];
          if (!table) {
            for (var k in tables) {
              if (tables.hasOwnProperty(k) && (k === tableKey || k.indexOf("." + tableKey) >= 0)) {
                table = tables[k]; break;
              }
            }
          }
          if (table && table.columns) {
            var hintText = "\u2192 columns: " + table.columns.map(function(c) {
              var parts = [c.name + "(" + c.type + ")"];
              if ((table.primaryKey || []).indexOf(c.name) >= 0) parts.push("PK");
              if (!c.nullable) parts.push("NOT NULL");
              return parts.join(" ");
            }).join(", ");
            typeHints.text(hintText);
            return;
          }
        }
        typeHints.text("");
      }

      function checkMagicState() {
        var configId = $("#node-input-PostgresDBNode").val();
        if (!configId) {
          magicGenerate.prop("disabled", true).attr("title", "Select a PostgresDBNode first");
          genQueryBtn.prop("disabled", true).attr("title", "Select a PostgresDBNode first");
          return;
        }
        $.getJSON("postgres-introspect/schema/" + configId, function(data) {
          console.log("[postgres-autocomplete] checkMagicState: stale=" + !!data.stale + " configId=" + configId);
          if (data.stale) {
            magicGenerate.prop("disabled", true).attr("title", "Schema not loaded");
            genQueryBtn.prop("disabled", true).attr("title", "Schema not loaded");
          } else {
            self._schemaCache = data;
            magicGenerate.prop("disabled", false).removeAttr("title");
            genQueryBtn.prop("disabled", false).removeAttr("title");
            updateTypeHints();
          }
        }).fail(function() {
          magicGenerate.prop("disabled", true).attr("title", "Cannot reach schema endpoint");
          genQueryBtn.prop("disabled", true);
        });
      }

      checkMagicState();
      $("#node-input-PostgresDBNode").on("change", checkMagicState);

      magicGenerate.click(function() {
        var prompt = magicPrompt.val().trim();
        if (!prompt) return;
        var configId = $("#node-input-PostgresDBNode").val();
        magicGenerate.prop("disabled", true).html('<i class="fa fa-spinner fa-spin"></i>');
        magicResult.hide(); magicActions.hide(); magicError.hide();
        $.ajax({
          url: "postgres-node/generate-query",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({ prompt: prompt, configId: configId }),
          success: function(data) {
            magicResult.text(data.query).show(); magicActions.show();
          },
          error: function(jqXHR) {
            var err = jqXHR.responseJSON && jqXHR.responseJSON.error || "Unknown error";
            magicError.text("Error: " + err).show();
          },
          complete: function() {
            magicGenerate.prop("disabled", false).html('<i class="fa fa-magic"></i> Generate');
          }
        });
      });

      $("#postgres-magic-insert").click(function() {
        var query = magicResult.text();
        if (query && self.editor) {
          self.editor.setValue(query);
          self.editor.focus();
          magicResult.hide(); magicActions.hide(); magicError.hide();
          magicPrompt.val("");
          updateTypeHints();
        }
      });

      $("#postgres-magic-retry").click(function() { magicGenerate.click(); });
      $("#postgres-magic-cancel").click(function() {
        magicResult.hide(); magicActions.hide(); magicError.hide();
      });

      genQueryBtn.click(function() {
        if (!self._schemaCache) return;
        var tables = self._schemaCache.tables || {};
        var tableNames = Object.keys(tables);
        if (tableNames.length === 0) return;
        var tableName = prompt("Enter table name (e.g. public.users):", tableNames[0]);
        if (!tableName) return;
        var table = tables[tableName];
        if (!table) { alert("Table not found in schema"); return; }
        var action = prompt("Action: SELECT, INSERT, UPDATE, or DELETE?", "SELECT");
        if (!action) return;
        var cols = (table.columns || []).filter(function(c) { return !c.isGenerated && !c.isIdentity; });
        var colNames = cols.map(function(c) { return c.name; });
        var pk = table.primaryKey || [];
        var query = "";
        if (action.toUpperCase() === "SELECT") {
          query = "SELECT " + colNames.join(", ") + "\nFROM " + tableName + "\nWHERE ";
          if (pk.length > 0) {
            for (var i = 0; i < pk.length; i++) {
              query += pk[i] + " = $" + (i + 1);
              if (i < pk.length - 1) query += " AND ";
            }
          } else { query += "true"; }
        } else if (action.toUpperCase() === "INSERT") {
          query = "INSERT INTO " + tableName + " (" + colNames.join(", ") + ")\nVALUES (";
          for (var i = 0; i < colNames.length; i++) {
            query += "$" + (i + 1);
            if (i < colNames.length - 1) query += ", ";
          }
          query += ")\nRETURNING *";
        } else if (action.toUpperCase() === "UPDATE") {
          query = "UPDATE " + tableName + " SET ";
          var setParts = [];
          for (var i = 0; i < colNames.length; i++) {
            setParts.push(colNames[i] + " = $" + (i + 1));
          }
          query += setParts.join(", ");
          query += "\nWHERE ";
          if (pk.length > 0) {
            var pkOffset = colNames.length;
            for (var i = 0; i < pk.length; i++) {
              query += pk[i] + " = $" + (pkOffset + i + 1);
              if (i < pk.length - 1) query += " AND ";
            }
          } else { query += "true"; }
        } else if (action.toUpperCase() === "DELETE") {
          query = "DELETE FROM " + tableName + "\nWHERE ";
          if (pk.length > 0) {
            for (var i = 0; i < pk.length; i++) {
              query += pk[i] + " = $" + (i + 1);
              if (i < pk.length - 1) query += " AND ";
            }
          } else { query += "true"; }
        }
        if (query && self.editor) {
          self.editor.setValue(query);
          self.editor.focus();
          updateTypeHints();
        }
      });

      self.editor.on("change", updateTypeHints);
    },
    oneditsave: function () {
      $("#node-input-query").val(this.editor.getValue());
      delete this.editor;
    }
  });
</script>
<script type="text/x-red" data-help-name="PostgresNode">
    <h3>PostgresNode — PostgreSQL Query</h3>
    <p>Executes SQL queries against a PostgreSQL database using parameterized templates. Supports Mustache templating, named parameters, transactions, cursor streaming, COPY import/export, and automatic retry on transient errors.</p>
    <h4>Connection</h4>
    <dl>
      <dt><b>Name</b></dt><dd>Label for this node in the flow.</dd>
      <dt><b>Server</b></dt><dd>Select a PostgresDBNode that defines the database connection.</dd>
    </dl>
    <h4>Execution Modes</h4>
    <dl>
      <dt><b>Throw Exception</b></dt><dd>ON: SQL errors halt the flow. OFF: errors attached to <code>msg.error</code> and message continues downstream.</dd>
      <dt><b>Named Parameters</b></dt><dd>When ON, <code>msg.params</code> is a key-value object (<code>{id: 42, name: "Alice"}</code>) bound to <code>$1, $2</code> in insertion order. Mustache renders first, then params bind.</dd>
      <dt><b>Transaction Mode</b></dt><dd>When ON, <code>msg.payload</code> must be an array of <code>{query, params, output}</code> objects. All execute atomically within <code>BEGIN/COMMIT</code>. On failure: auto-<code>ROLLBACK</code>. First <code>output: true</code> determines <code>msg.payload.rows</code>.</dd>
      <dt><b>Cursor Mode</b></dt><dd>Streams large <code>SELECT</code> results in batches via PostgreSQL <code>DECLARE/FETCH</code>. Each batch emits a separate message: <code>{payload: [...rows], batch: {index, rows, total}}</code>. Final message: <code>{payload: [], complete: true, total: N}</code>. Non-SELECT queries ignored.</dd>
      <dt><b>COPY Mode</b></dt><dd>High-performance CSV import/export via PostgreSQL COPY protocol. <code>COPY FROM STDIN</code> sends <code>msg.payload</code> as CSV. <code>COPY TO STDOUT</code> returns CSV as string.</dd>
      <dt><b>Retry on Transient Errors</b></dt><dd>Auto-retries on deadlock (40P01), serialization failure (40001), connection resets. Uses jittered exponential backoff. Does NOT apply to Cursor or COPY mode.</dd>
    </dl>
    <h4>Limits</h4>
    <dl>
      <dt><b>Query Timeout (ms)</b></dt><dd>Per-query timeout. 0 = no timeout. Overrides the pool's statement_timeout. Reset in finally block.</dd>
      <dt><b>Cursor Batch Size</b></dt><dd>Rows per <code>FETCH</code> in Cursor Mode (default: 100).</dd>
      <dt><b>Max Retries</b></dt><dd>Max retry attempts before propagating error (default: 3).</dd>
      <dt><b>Retry Base Delay (ms)</b></dt><dd>Base delay for backoff: <code>min(5000, base × 2^attempt) × random</code> (default: 100).</dd>
    </dl>
    <h4>Type Mapping</h4>
    <dl>
      <dt><b>Map numeric → number</b></dt><dd>Convert <code>NUMERIC</code> to JS number. Warning: precision loss for large values.</dd>
